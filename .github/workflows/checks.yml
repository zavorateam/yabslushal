name: Checks

on:
  push:
    paths:
      - "**/gradle-wrapper.jar"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "**/gradle-wrapper.jar"
  workflow_dispatch:

jobs:
  validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run wrapper validation
        uses: gradle/actions/wrapper-validation@v4
